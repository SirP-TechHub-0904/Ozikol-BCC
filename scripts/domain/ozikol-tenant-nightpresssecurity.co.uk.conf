# ==============================================================
# Ozikol BCC Custom Domain - nightpresssecurity.co.uk
# Tenant: nightpress
# SSL: Let's Encrypt Active
# ==============================================================

# HTTP -> HTTPS Redirect & ACME
server {
    listen 80;
    listen [::]:80;
    server_name nightpresssecurity.co.uk www.nightpresssecurity.co.uk;

    # ACME Challenge for Let's Encrypt Renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nightpresssecurity.co.uk www.nightpresssecurity.co.uk;

    ssl_certificate /etc/letsencrypt/live/nightpresssecurity.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nightpresssecurity.co.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Static Angular Client
    root /var/www/ozikol-client;
    index index.html;
    client_max_body_size 50M;

    # Backend API Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-Slug nightpress;
        proxy_set_header X-Tenant-Domain nightpresssecurity.co.uk;
        proxy_set_header X-Tenant-Custom-Domain nightpresssecurity.co.uk;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # SignalR Realtime Hubs Proxy
    location /hubs/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-Slug nightpress;
        proxy_set_header X-Tenant-Domain nightpresssecurity.co.uk;
        proxy_set_header X-Tenant-Custom-Domain nightpresssecurity.co.uk;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # SPA Client Routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
