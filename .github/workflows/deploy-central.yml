# ===================================================================
# CI/CD Workflow: Deploy Ozikol Central Governance Dashboard
# Target: https://ozikol.cloud (VPS Port 5001)
# ===================================================================

name: Deploy Ozikol Central

on:
  push:
    branches: [ master ]
    paths:
      - 'src/Ozikol.Central/**'
      - 'src/Ozikol.MasterDomain/**'
      - 'src/Ozikol.MasterPersistence.EF.MasterSQL/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish Ozikol Central
        run: |
          dotnet publish src/Ozikol.Central/Ozikol.Central.csproj -c Release -o ./publish-central

      # Build Docker image for Central only
      - name: Build Docker image (Central only)
        run: |
          docker build -f Dockerfile.central -t ozikol/central:latest .

      # Export image to tarball
      - name: Export image
        run: docker save ozikol/central:latest -o ozikol-central.tar

      # Transfer tarball to VPS
      - name: SCP image tarball to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "ozikol-central.tar"
          target: "/tmp/ozikol-central.tar"

      # Deploy on VPS: stop old container, load new image, run new container
      - name: Deploy Central on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # Check if tarball arrived as a regular file
            if [ -f /tmp/ozikol-central.tar ]; then
              echo "Loading ozikol-central image..."
              docker rm -f ozikol-central || true
              docker load -i /tmp/ozikol-central.tar
              docker run -d --name ozikol-central \
                --restart unless-stopped \
                -p 127.0.0.1:5001:8080 \
                ozikol/central:latest dotnet Ozikol.Central.dll
              rm -f /tmp/ozikol-central.tar
              echo "ozikol-central deployed successfully."
            else
              echo "Skipping ozikol-central deployment: /tmp/ozikol-central.tar not found or is a directory."
              rm -rf /tmp/ozikol-central.tar || true
            fi
