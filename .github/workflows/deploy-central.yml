# ===================================================================
# CI/CD Workflow: Deploy Ozikol Central Governance Dashboard
# Target: https://ozikol.cloud (Native systemd Service on Port 5001)
# ===================================================================

name: Deploy Ozikol Central

on:
  push:
    branches: [ master ]
    paths:
      - 'src/Ozikol.Central/**'
      - 'src/Ozikol.MasterDomain/**'
      - 'src/Ozikol.MasterPersistence.EF.MasterSQL/**'
      - 'src/Ozikol-BCC.Domain/**'
      - 'src/Ozikol-BCC.Persistence.EF.SQL/**'
      - '.github/workflows/deploy-central.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish Ozikol Central
        run: |
          dotnet publish src/Ozikol.Central/Ozikol.Central.csproj -c Release -o ./publish-central

      - name: Package Central Archive
        run: |
          tar -czf publish-central.tar.gz -C ./publish-central .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${{ secrets.VPS_PORT }}"
          PORT="${PORT:-22}"
          ssh-keyscan -p "$PORT" -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: SCP Archive to VPS
        run: |
          PORT="${{ secrets.VPS_PORT }}"
          PORT="${PORT:-22}"
          scp -i ~/.ssh/deploy_key -P "$PORT" publish-central.tar.gz ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/publish-central.tar.gz

      - name: Deploy on VPS
        run: |
          PORT="${{ secrets.VPS_PORT }}"
          PORT="${PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "$PORT" ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            mkdir -p /var/www/ozikol-central
            tar -xzf /tmp/publish-central.tar.gz -C /var/www/ozikol-central/
            rm -f /tmp/publish-central.tar.gz
            systemctl restart ozikol-central
            sleep 2
            systemctl is-active --quiet ozikol-central && echo "ozikol-central deployed successfully and active." || (journalctl -u ozikol-central -n 20 --no-pager && exit 1)
          EOF
