# ===================================================================
# CI/CD Workflow: Deploy Ozikol Multi-Tenant Angular Client
# Target: https://*.ozikol.cloud (Served via ozikol-client Docker container on port 4200)
# ===================================================================

name: Deploy Angular Client

on:
  push:
    branches: [ master ]
    paths:
      - 'src/Ozikol-BCC.Client/**'
      - '.github/workflows/deploy-client.yml'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Node.js 20 on the GitHub Actions runner
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'src/Ozikol-BCC.Client/package-lock.json'

      # Install dependencies, build, and normalize dist folder
      - name: Install & Build Angular Production
        run: |
          cd src/Ozikol-BCC.Client
          npm ci
          npm run build -- --configuration production
          
          # Create normalized publish directory at repository root
          mkdir -p ../../publish-client
          
          # Copy compiled output regardless of Angular's casing/browser folder
          if [ -d "dist/Ozikol-BCC.Client/browser" ]; then
            cp -r dist/Ozikol-BCC.Client/browser/* ../../publish-client/
          elif [ -d "dist/Ozikol-BCC.Client" ]; then
            cp -r dist/Ozikol-BCC.Client/* ../../publish-client/
          elif [ -d "dist/ozikol-bcc-client/browser" ]; then
            cp -r dist/ozikol-bcc-client/browser/* ../../publish-client/
          elif [ -d "dist/ozikol-bcc-client" ]; then
            cp -r dist/ozikol-bcc-client/* ../../publish-client/
          elif [ -d "dist/ozikol-bcc.client/browser" ]; then
            cp -r dist/ozikol-bcc.client/browser/* ../../publish-client/
          elif [ -d "dist/ozikol-bcc.client" ]; then
            cp -r dist/ozikol-bcc.client/* ../../publish-client/
          else
            cp -r dist/*/* ../../publish-client/
          fi
          
          # List files to verify index.html is ready
          ls -la ../../publish-client/

      # Sync the normalized static distribution files directly to Nginx web root
      - name: Sync Angular Dist to VPS
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          SOURCE: "publish-client/"
          TARGET: "/var/www/client"

      # Ensure Nginx (www-data) has read access and update live ozikol-client container
      - name: Update ozikol-client Container
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${{ secrets.VPS_PORT }}"
          PORT="${PORT:-22}"
          ssh-keyscan -p "$PORT" -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "$PORT" ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            chown -R www-data:www-data /var/www/client
            chmod -R 755 /var/www/client
            docker exec ozikol-client nginx -s reload || docker restart ozikol-client
            echo "ozikol-client reloaded successfully with newest static assets."
          EOF
