# ===================================================================
# CI/CD Workflow: Deploy Ozikol Multi-Tenant Angular Client
# Target: https://app.ozikol.cloud & *.ozikol.cloud (Native Nginx Static Host)
# ===================================================================

name: Deploy Angular Client

on:
  push:
    branches: [ master ]
    paths:
      - 'src/Ozikol-BCC.Client/**'
      - '.github/workflows/deploy-client.yml'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'src/Ozikol-BCC.Client/package-lock.json'

      - name: Install & Build Angular Production
        run: |
          cd src/Ozikol-BCC.Client
          npm ci
          npm run build -- --configuration production
          
          mkdir -p ../../publish-client
          
          if [ -d "dist/Ozikol-BCC.Client/browser" ]; then
            cp -r dist/Ozikol-BCC.Client/browser/* ../../publish-client/
          elif [ -d "dist/Ozikol-BCC.Client" ]; then
            cp -r dist/Ozikol-BCC.Client/* ../../publish-client/
          elif [ -d "dist/ozikol-bcc-client/browser" ]; then
            cp -r dist/ozikol-bcc-client/browser/* ../../publish-client/
          elif [ -d "dist/ozikol-bcc-client" ]; then
            cp -r dist/ozikol-bcc-client/* ../../publish-client/
          elif [ -d "dist/ozikol-bcc.client/browser" ]; then
            cp -r dist/ozikol-bcc.client/browser/* ../../publish-client/
          elif [ -d "dist/ozikol-bcc.client" ]; then
            cp -r dist/ozikol-bcc.client/* ../../publish-client/
          else
            cp -r dist/*/* ../../publish-client/
          fi
          
          ls -la ../../publish-client/

      - name: Package Client Archive
        run: |
          tar -czf publish-client.tar.gz -C ./publish-client .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${{ secrets.VPS_PORT }}"
          PORT="${PORT:-22}"
          ssh-keyscan -p "$PORT" -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: SCP Archive to VPS
        run: |
          PORT="${{ secrets.VPS_PORT }}"
          PORT="${PORT:-22}"
          scp -i ~/.ssh/deploy_key -P "$PORT" publish-client.tar.gz ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/publish-client.tar.gz

      - name: Deploy on VPS
        run: |
          PORT="${{ secrets.VPS_PORT }}"
          PORT="${PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "$PORT" ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            mkdir -p /var/www/ozikol-client
            tar -xzf /tmp/publish-client.tar.gz -C /var/www/ozikol-client/
            rm -f /tmp/publish-client.tar.gz
            chown -R www-data:www-data /var/www/ozikol-client
            chmod -R 755 /var/www/ozikol-client
            systemctl reload nginx
            echo "ozikol-client deployed successfully and Nginx reloaded."
          EOF
