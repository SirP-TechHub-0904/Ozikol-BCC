# ===================================================================
# CI/CD Workflow: Deploy Ozikol Multi-Tenant Angular Client
# Target: https://*.ozikol.cloud (Served statically via Nginx)
# ===================================================================

name: Deploy Angular Client

on:
  push:
    branches: [ master ]
    # Only triggers when frontend Angular code changes
    paths:
      - 'src/Ozikol-BCC.Client/**'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Node.js 20 on the GitHub Actions runner
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'src/Ozikol-BCC.Client/package-lock.json'

      # Install dependencies and build production bundle (AOT, minified, optimized)
      - name: Install & Build Angular Production
        run: |
          cd src/Ozikol-BCC.Client
          npm ci
          npm run build -- --configuration production

      # Sync the compiled static distribution files directly to Nginx web root
      - name: Sync Angular Dist to VPS
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          # In Angular 17/18/19, compiled static files output to dist/Ozikol-BCC.Client/browser/
          SOURCE: "src/Ozikol-BCC.Client/dist/Ozikol-BCC.Client/browser/"
          TARGET: "/var/www/client"

      # Ensure Nginx (www-data) has read access to the HTML/CSS/JS files
      - name: Set Permissions
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            chown -R www-data:www-data /var/www/client
            chmod -R 755 /var/www/client
