# ===================================================================
# CI/CD Workflow: Deploy Ozikol Python HTML Extractor
# Target: https://html.ozikol.cloud (VPS Port 8001)
# ===================================================================

name: Deploy Python HTML Extractor

on:
  push:
    branches: [ master ]
    # Only triggers when Python extractor code changes
    paths:
      - 'src/Ozikol-Html-Extractor/**'

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Sync Python scripts to VPS (excluding venv to prevent Linux/OS mismatch)
      - name: Sync Python Code to VPS (Preserving .env and venv)
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          SOURCE: "src/Ozikol-Html-Extractor/"
          TARGET: "/var/www/extractor"
          # CRITICAL: Exclude .env (secrets), venv (server Python environment), and Python cache
          EXCLUDE: ".env, .env.*, venv/, __pycache__/"

      # Install/Update any new Python packages and restart the service
      - name: Install Dependencies & Restart Extractor Service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/extractor
            
            # If requirements.txt exists, install/update packages using the server's virtual environment
            if [ -f requirements.txt ]; then
              /var/www/extractor/venv/bin/pip install --upgrade pip
              /var/www/extractor/venv/bin/pip install -r requirements.txt
            fi
            
            # Set permissions
            chown -R www-data:www-data /var/www/extractor
            chmod 600 /var/www/extractor/.env
            
            # Restart the Extractor systemd service
            systemctl enable ozikol-extractor.service
            systemctl restart ozikol-extractor.service
            systemctl status ozikol-extractor.service --no-pager
