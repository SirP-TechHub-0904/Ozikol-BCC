# ===================================================================
# CI/CD Workflow: Deploy Ozikol-BCC Backend API
# Target: https://api-ozikol.ozikol.cloud & *.ozikol.cloud/api/ (VPS Port 5000)
# ===================================================================

name: Deploy Ozikol API

on:
  push:
    branches: [ master ]
    paths:
      - 'src/Ozikol-BCC.Api/**'
      - 'src/Ozikol-BCC.Domain/**'
      - 'src/Ozikol-BCC.Persistence.EF.SQL/**'
      - 'src/Ozikol-BCC.Application/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish Ozikol API
        run: |
          dotnet publish src/Ozikol-BCC.Api/Ozikol-BCC.Api.csproj -c Release -o ./publish-api

      # Build Docker image for API only
      - name: Build Docker image (API only)
        run: |
          docker build -f Dockerfile.api -t ozikol/api:latest .

      # Export image to tarball
      - name: Export image
        run: docker save ozikol/api:latest -o ozikol-api.tar

      # Transfer tarball to VPS using native OpenSSH (Zero external downloads, No 403 errors)
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${{ secrets.VPS_PORT }}"
          PORT="${PORT:-22}"
          ssh-keyscan -p "$PORT" -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: SCP image tarball to VPS
        run: |
          PORT="${{ secrets.VPS_PORT }}"
          PORT="${PORT:-22}"
          scp -i ~/.ssh/deploy_key -P "$PORT" ozikol-api.tar ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/ozikol-api.tar

      # Deploy on VPS: stop old container, load new image, run new container
      - name: Deploy on VPS
        run: |
          PORT="${{ secrets.VPS_PORT }}"
          PORT="${PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "$PORT" ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            if [ -f /tmp/ozikol-api.tar ]; then
              echo "Loading ozikol-api image..."
              docker rm -f ozikol-api || true
              docker load -i /tmp/ozikol-api.tar
              docker run -d --name ozikol-api \
                --restart unless-stopped \
                -p 127.0.0.1:5000:8080 \
                ozikol/api:latest dotnet Ozikol-BCC.Api.dll
              rm -f /tmp/ozikol-api.tar
              echo "ozikol-api deployed successfully."
            else
              echo "Skipping ozikol-api deployment: /tmp/ozikol-api.tar not found or is a directory."
              rm -rf /tmp/ozikol-api.tar || true
            fi
          EOF
