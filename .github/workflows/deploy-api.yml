# ===================================================================
# CI/CD Workflow: Deploy Ozikol-BCC Backend API
# Target: https://api.ozikol.cloud (Native systemd Service on Port 5000)
# ===================================================================

name: Deploy Ozikol API

on:
  push:
    branches: [ master ]
    paths:
      - 'src/Ozikol-BCC.Api/**'
      - 'src/Ozikol-BCC.Domain/**'
      - 'src/Ozikol-BCC.Persistence.EF.SQL/**'
      - 'src/Ozikol-BCC.Application/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish Ozikol API
        run: |
          dotnet publish src/Ozikol-BCC.Api/Ozikol-BCC.Api.csproj -c Release -o ./publish-api

      - name: Package API Archive
        run: |
          tar -czf publish-api.tar.gz -C ./publish-api .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${{ secrets.VPS_PORT }}"
          PORT="${PORT:-22}"
          ssh-keyscan -p "$PORT" -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: SCP Archive to VPS
        run: |
          PORT="${{ secrets.VPS_PORT }}"
          PORT="${PORT:-22}"
          scp -i ~/.ssh/deploy_key -P "$PORT" publish-api.tar.gz ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/publish-api.tar.gz

      - name: Deploy on VPS
        run: |
          PORT="${{ secrets.VPS_PORT }}"
          PORT="${PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "$PORT" ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            mkdir -p /var/www/ozikol-api
            tar -xzf /tmp/publish-api.tar.gz -C /var/www/ozikol-api/
            rm -f /tmp/publish-api.tar.gz
            systemctl restart ozikol-api
            sleep 2
            systemctl is-active --quiet ozikol-api && echo "ozikol-api deployed successfully and active." || (journalctl -u ozikol-api -n 20 --no-pager && exit 1)
          EOF
