<section class="oz-document-section {{ CustomClass }}">
  <div class="oz-container">
    <div class="oz-document-header">
      {{#if MiniTitle}}<span class="oz-badge">{{ MiniTitle }}</span>{{/if}}
      <h1 class="oz-document-title">{{ Title }}</h1>
      {{#if Description}}<p class="oz-document-subtitle">{{ Description }}</p>{{/if}}
    </div>
    <div class="oz-document-body">
      {{{ FullDescription }}}
    </div>
  </div>
</section>
