<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title></title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Anti-Cache Meta Directives: Prevents Mobile/Desktop Browsers from Caching HTML Shell on Deploy -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="icon" id="app-dynamic-favicon" href="data:,">
  <link rel="shortcut icon" href="data:,">
  <script>
    (function() {
      try {
        var host = window.location.hostname || '';
        var parts = host.split('.');
        var defaultBrand = (parts.length >= 2 && parts[0] !== 'www' && parts[0] !== 'localhost' && parts[0] !== '127')
          ? parts[0].charAt(0).toUpperCase() + parts[0].slice(1)
          : '';
        var cachedTitle = localStorage.getItem('tenant_name') || defaultBrand;
        if (cachedTitle && !cachedTitle.toLowerCase().includes('ozikol')) {
          document.title = cachedTitle;
        }
        var cachedFavicon = localStorage.getItem('tenant_favicon');
        if (cachedFavicon) {
          var fav = document.getElementById('app-dynamic-favicon');
          if (fav) fav.href = cachedFavicon;
        }
      } catch (e) {}
    })();
  </script>
  <!-- Font Awesome 6.5.1 & Google Material Icons for Admin Dashboard UI -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- Google Material Icons for Admin Dashboard UI -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
  <app-root>
    <style>
      .oz-bootstrap-bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 3px;
        background: #f1f5f9;
        overflow: hidden;
        z-index: 2147483647;
      }
      .oz-bootstrap-bar-indicator {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 45%;
        background: linear-gradient(90deg, #0050e5, #3b82f6);
        box-shadow: 0 0 10px rgba(0, 80, 229, 0.45);
        border-radius: 3px;
        animation: oz-bar-slide 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes oz-bar-slide {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(120%); }
        100% { transform: translateX(300%); }
      }
    </style>
    <div class="oz-bootstrap-bar" role="progressbar" aria-label="Loading workspace">
      <div class="oz-bootstrap-bar-indicator"></div>
    </div>
  </app-root>
</body>
</html>
